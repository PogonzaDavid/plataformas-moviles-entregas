<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Editor de Texto</h1>
        <div class="card">
            <div class="card-body">
                <h2>Texto</h2>

                <p class="texto" id="texto">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.</p>

                <div class="mb-3">
                    <label for="entrada-texto" class="form-label">Editar texto</label>
                    <input type="text" class="form-control" id="entrada-texto" value="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.">
                </div>

                <hr class="hr">

                <h2>Opciones de Formato</h2>
                <div class="row">
                    <div class="col-12 col-md-3 my-1">
                        <button id="btn-negrita" type="button" class="btn d-block w-100 btn-outline-primary" data-formato="negrita" aria-pressed="false">
                            Bold (Negrita)
                        </button>
                    </div>
                    <div class="col-12 col-md-3 my-1">
                        <button id="btn-cursiva" type="button" class="btn d-block w-100 btn-outline-primary" data-formato="cursiva" aria-pressed="false">
                            Italic (Cursiva)
                        </button>
                    </div>
                    <div class="col-12 col-md-3 my-1">
                        <button id="btn-subrayado" type="button" class="btn d-block w-100 btn-outline-primary" data-formato="subrayado" aria-pressed="false">
                            Underline (Subrayado)
                        </button>
                    </div>
                    <div class="col-12 col-md-3 my-1">
                        <button id="btn-color" type="button" class="btn d-block w-100 btn-outline-primary" data-formato="color" aria-pressed="false">
                            Color (Rojo)
                        </button>
                    </div>
                </div>
                <div class="mt-3">
                    <label for="tamano-texto" class="form-label">Tamaño del texto: <span id="valor-tamano">16</span> px</label>
                    <input type="range" class="form-range" id="tamano-texto" min="12" max="48" value="16">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /**
         * funcionNegrita()
         * Esta función se ejecuta cuando el usuario selecciona la opción Bold (negrita).
         */
        function funcionNegrita() {
            alternarFormato('negrita');
        }

        /**
         * funcionCursiva()
         * Esta función se ejecuta cuando el usuario selecciona la opción Italic (cursiva).
         */
        function funcionCursiva() {
            alternarFormato('cursiva');
        }

        /**
         * funcionSubrayado()
         * Esta función se ejecuta cuando el usuario selecciona la opción Underline (subrayado).
         */
        function funcionSubrayado() {
            alternarFormato('subrayado');
        }

        const texto = document.getElementById('texto');
        const entradaTexto = document.getElementById('entrada-texto');
        const estilos = {
            negrita: false,
            cursiva: false,
            subrayado: false,
            color: false
        };

        function alternarFormato(formato) {
            estilos[formato] = !estilos[formato];
            actualizarTexto();
            actualizarBoton(formato);
        }

        function actualizarTexto() {
            texto.style.fontWeight = estilos.negrita ? 'bold' : 'normal';
            texto.style.fontStyle = estilos.cursiva ? 'italic' : 'normal';
            texto.style.textDecoration = estilos.subrayado ? 'underline' : 'none';
            texto.style.color = estilos.color ? 'red' : '';
        }

        function actualizarBoton(formato) {
            const boton = document.querySelector(`[data-formato="${formato}"]`);
            const activo = estilos[formato];
            boton.setAttribute('aria-pressed', String(activo));
            boton.classList.toggle('btn-primary', activo);
            boton.classList.toggle('btn-outline-primary', !activo);
        }

        function handlerBoton(e) {
            // Obtiene el valor del atributo "data-formato" del botón que disparó el evento
            const funcionBoton = e.target.dataset.formato;
            switch (funcionBoton) {
                case 'negrita':
                    funcionNegrita();
                    break;
                case 'cursiva':
                    funcionCursiva();
                    break;
                case 'subrayado':
                    funcionSubrayado();
                    break;
                case 'color':
                    alternarFormato('color');
                    break;
            }
        }
        document.querySelectorAll('button.btn').forEach(e => e.addEventListener('click', handlerBoton));

        entradaTexto.addEventListener('input', () => {
            texto.textContent = entradaTexto.value;
        });

        const controlTamano = document.getElementById('tamano-texto');
        const valorTamano = document.getElementById('valor-tamano');
        controlTamano.addEventListener('input', () => {
            texto.style.fontSize = `${controlTamano.value}px`;
            valorTamano.textContent = controlTamano.value;
        });
    </script>
</body>
</html>
