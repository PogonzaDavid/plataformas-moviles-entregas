<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>
        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>
                
                <ul id="lista-productos"></ul>
                <p id="aviso-almacenamiento" class="text-danger" role="alert" aria-live="polite"></p>

                <div class="mb-3">
                    <button id="ordenar-productos" class="btn btn-secondary" type="button">Ordenar alfabéticamente</button>
                    <button id="limpiar-lista" class="btn btn-outline-danger" type="button">Limpiar lista</button>
                </div>

                <hr class="hr">

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto">
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const CLAVE_ALMACENAMIENTO = 'lista-compras-productos';
        const listaProductos = document.querySelector('#lista-productos');
        const avisoAlmacenamiento = document.querySelector('#aviso-almacenamiento');
        let productos = [{ nombre: 'Pan', comprado: false }];
        let indiceEnEdicion = null;

        try {
            const productosGuardados = localStorage.getItem(CLAVE_ALMACENAMIENTO);
            if (productosGuardados !== null) {
                const datos = JSON.parse(productosGuardados);
                if (!Array.isArray(datos) || datos.some(function (producto) {
                    return !producto || typeof producto.nombre !== 'string' || typeof producto.comprado !== 'boolean';
                })) {
                    throw new Error('El formato de la lista guardada no es válido.');
                }
                productos = datos;
            }
        } catch (error) {
            avisoAlmacenamiento.textContent = 'No se pudo cargar la lista guardada. Se mostrará una lista nueva.';
            console.error('Error al cargar la lista de compras:', error);
        }

        function guardarProductos() {
            try {
                localStorage.setItem(CLAVE_ALMACENAMIENTO, JSON.stringify(productos));
                avisoAlmacenamiento.textContent = '';
            } catch (error) {
                avisoAlmacenamiento.textContent = 'No se pudo guardar la lista en este navegador.';
                console.error('Error al guardar la lista de compras:', error);
            }
        }

        function mostrarProductos() {
            listaProductos.replaceChildren();
            productos.forEach(function (producto, indice) {
                const elemento = document.createElement('li');
                elemento.className = 'mb-2';

                const casilla = document.createElement('input');
                casilla.type = 'checkbox';
                casilla.className = 'form-check-input me-2';
                casilla.checked = producto.comprado;
                casilla.dataset.accion = 'comprado';
                casilla.dataset.indice = indice;
                casilla.setAttribute('aria-label', `Marcar ${producto.nombre} como comprado`);

                if (indiceEnEdicion === indice) {
                    const formularioEdicion = document.createElement('form');
                    formularioEdicion.className = 'd-inline-flex align-items-center gap-2';
                    formularioEdicion.dataset.accion = 'guardar-edicion';
                    formularioEdicion.dataset.indice = indice;

                    const campoEdicion = document.createElement('input');
                    campoEdicion.type = 'text';
                    campoEdicion.className = 'form-control form-control-sm';
                    campoEdicion.value = producto.nombre;
                    campoEdicion.required = true;
                    campoEdicion.setAttribute('aria-label', 'Nuevo nombre del producto');

                    const botonGuardar = document.createElement('button');
                    botonGuardar.className = 'btn btn-sm btn-primary';
                    botonGuardar.type = 'submit';
                    botonGuardar.textContent = 'Guardar';

                    const botonCancelar = document.createElement('button');
                    botonCancelar.className = 'btn btn-sm btn-outline-secondary';
                    botonCancelar.type = 'button';
                    botonCancelar.textContent = 'Cancelar';
                    botonCancelar.dataset.accion = 'cancelar-edicion';
                    botonCancelar.dataset.indice = indice;

                    formularioEdicion.append(campoEdicion, botonGuardar, botonCancelar);
                    elemento.append(casilla, formularioEdicion);
                    listaProductos.append(elemento);
                    campoEdicion.focus();
                    return;
                }

                const nombre = document.createElement('span');
                nombre.textContent = producto.nombre;
                if (producto.comprado) {
                    nombre.className = 'text-decoration-line-through text-muted';
                }

                const botonEditar = document.createElement('button');
                botonEditar.className = 'btn btn-sm btn-outline-secondary ms-2';
                botonEditar.type = 'button';
                botonEditar.textContent = 'Editar';
                botonEditar.dataset.accion = 'editar';
                botonEditar.dataset.indice = indice;
                botonEditar.setAttribute('aria-label', `Editar ${producto.nombre}`);

                const botonEliminar = document.createElement('button');
                botonEliminar.className = 'btn btn-sm btn-outline-danger ms-2';
                botonEliminar.type = 'button';
                botonEliminar.textContent = 'Eliminar';
                botonEliminar.dataset.accion = 'eliminar';
                botonEliminar.dataset.indice = indice;
                botonEliminar.setAttribute('aria-label', `Eliminar ${producto.nombre}`);

                elemento.append(casilla, nombre, botonEditar, botonEliminar);
                listaProductos.append(elemento);
            });
        }

        function agregarProducto(nombreProducto) {
            const nombre = nombreProducto.trim();
            if (!nombre) {
                return;
            }
            productos.push({ nombre: nombre, comprado: false });
            mostrarProductos();
            guardarProductos();
        }

        function handlerFormulario(evento) {
            evento.preventDefault();
            const input = evento.target.querySelector('input');
            const nombreProducto = input.value.trim();
            if (nombreProducto) {
                agregarProducto(nombreProducto);
                input.value = "";
            }
        }

        document.querySelector('#form-producto').addEventListener('submit', handlerFormulario);

        listaProductos.addEventListener('click', function (evento) {
            const boton = evento.target.closest('button[data-accion]');
            if (!boton) {
                return;
            }

            const indice = Number(boton.dataset.indice);
            if (boton.dataset.accion === 'editar') {
                indiceEnEdicion = indice;
                mostrarProductos();
            } else if (boton.dataset.accion === 'cancelar-edicion') {
                indiceEnEdicion = null;
                mostrarProductos();
            } else if (boton.dataset.accion === 'eliminar') {
                productos.splice(indice, 1);
                indiceEnEdicion = null;
                mostrarProductos();
                guardarProductos();
            }
        });

        listaProductos.addEventListener('submit', function (evento) {
            const formulario = evento.target.closest('form[data-accion="guardar-edicion"]');
            if (!formulario) {
                return;
            }
            evento.preventDefault();
            const indice = Number(formulario.dataset.indice);
            const nuevoNombre = formulario.querySelector('input').value.trim();
            if (!nuevoNombre) {
                return;
            }
            productos[indice].nombre = nuevoNombre;
            indiceEnEdicion = null;
            mostrarProductos();
            guardarProductos();
        });

        listaProductos.addEventListener('change', function (evento) {
            if (evento.target.matches('input[data-accion="comprado"]')) {
                const indice = Number(evento.target.dataset.indice);
                productos[indice].comprado = evento.target.checked;
                mostrarProductos();
                guardarProductos();
            }
        });

        document.querySelector('#limpiar-lista').addEventListener('click', function () {
            productos = [];
            mostrarProductos();
            guardarProductos();
        });

        document.querySelector('#ordenar-productos').addEventListener('click', function () {
            productos.sort(function (productoA, productoB) {
                return productoA.nombre.localeCompare(productoB.nombre, 'es', { sensitivity: 'base' });
            });
            mostrarProductos();
            guardarProductos();
        });

        mostrarProductos();
    </script>
</body>
</html>
